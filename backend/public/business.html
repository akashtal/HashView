<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HashView - Business Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #210059, #FC8603);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #210059;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #FC8603;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .button {
            display: inline-block;
            background: white;
            color: #210059;
            padding: 15px 40px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .menu-container {
            margin-top: 20px;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 15px;
            color: #333;
            display: none;
        }

        .category-title {
            color: #210059;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0 10px;
            border-bottom: 2px solid #FC8603;
            padding-bottom: 5px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #111;
        }

        .item-desc {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .item-price {
            font-weight: bold;
            color: #210059;
            margin-left: 15px;
        }

        .stores {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .store-badge {
            display: block;
            height: 40px;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.7;
        }

        /* Scrollbar for menu */
        .menu-container::-webkit-scrollbar { width: 6px; }
        .menu-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .menu-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">H</div>
        <h1 id="title">Opening HashView...</h1>
        <p id="message">Please wait while we redirect you to the app.</p>
        <div class="loader" id="loader"></div>

        <div id="fallback" style="display: none;">
            <p><strong>Want to order directly in the app?</strong></p>
            <div class="stores">
                <a href="https://apps.apple.com/in/app/hashview/id6756681321" target="_blank">
                    <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
                        alt="Download on App Store" class="store-badge">
                </a>
                <a href="https://play.google.com/store/apps/details?id=com.hashview.apps&pcampaignid=web_share"
                    target="_blank">
                    <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
                        alt="Get it on Google Play" class="store-badge" style="height: 60px;">
                </a>
            </div>

            <!-- Web Menu Fallback -->
            <h3 style="margin-top: 25px; margin-bottom: 5px;">View Menu</h3>
            <p style="font-size: 13px; opacity: 0.8; margin-bottom: 10px;">(Cart & Ordering requires the app)</p>
            <div id="web-menu" class="menu-container">
                <div style="text-align:center; padding: 20px;">Loading menu...</div>
            </div>
        </div>

        <div class="footer">
            Powered by HashView
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const businessId = urlParams.get('id') || window.location.pathname.split('/').pop().replace('.html', '');

        // Update deep link for Menu
        const deepLink = `hashview://business/${businessId}/menu`;

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isAndroid = /android/i.test(userAgent);

        let appOpened = false;

        async function loadWebMenu() {
            try {
                const res = await fetch(`/api/menu-items/business/${businessId}/ordering`);
                const data = await res.json();
                const menuContainer = document.getElementById('web-menu');
                
                if (data.success && data.menu) {
                    let html = '';
                    // Assuming API returns data grouped by category as per Phase 2
                    for (const category of data.menu) {
                        html += `<div class="category-title">${category.category}</div>`;
                        for (const item of category.items) {
                            html += `
                            <div class="menu-item">
                                <div class="item-details">
                                    <div class="item-name">${item.name}</div>
                                    ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
                                </div>
                                <div class="item-price">£${item.price.toFixed(2)}</div>
                            </div>`;
                        }
                    }
                    if (html === '') html = '<div style="text-align:center; padding: 20px;">No items available</div>';
                    menuContainer.innerHTML = html;
                } else {
                    menuContainer.innerHTML = '<div style="text-align:center; padding: 20px;">Failed to load menu</div>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('web-menu').innerHTML = '<div style="text-align:center; padding: 20px;">Error loading menu</div>';
            }
        }

        if (isIOS || isAndroid) {
            // Attempt to open the app directly
            window.location.replace(deepLink);

            window.addEventListener('blur', function () {
                appOpened = true;
            });

            // If app doesn't open within 2.5 seconds, redirect to the respective app store
            setTimeout(function () {
                if (!appOpened) {
                    const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.hashview.apps';
                    const appStoreUrl = 'https://apps.apple.com/in/app/hashview/id6756681321';
                    window.location.replace(isAndroid ? playStoreUrl : appStoreUrl);
                }
            }, 2500);
        } else {
            // Desktop
            document.getElementById('loader').style.display = 'none';
            document.getElementById('fallback').style.display = 'block';
            document.getElementById('title').textContent = 'Web Menu';
            document.getElementById('message').textContent = 'Scan QR on mobile to order, or view menu below:';
            document.getElementById('web-menu').style.display = 'block';
            loadWebMenu();
        }
    </script>
</body>
</html>
